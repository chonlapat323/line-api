services:
  postgres:
    image: postgres:16-alpine
    container_name: line_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: line_sender
    ports:
      - "5433:5432"
    volumes:
      - line_pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d line_sender"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  line_pgdata:
